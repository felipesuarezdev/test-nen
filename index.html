<style>
/* Layout: un solo rollo vertical de 680px. El hexagrama es el instrumento que se repite en portada y resultado;
   tinta índigo sobre papel pálido de día, oro sobre papel índigo de noche (sutras konshi kinji). */
:root{
  --paper:#EDF0F6; --paper-2:#F9FAFD; --ink:#16203C; --ink-2:#3F4B6E; --ink-3:#5F6B8C; --rule:#C8D0E0;
  --gold:#85590A; --gold-fill:#B58A24; --seal:#B03A2E; --seal-ink:#FBF3EC;
  --water:#A9C4E8; --water-alt:#D7B463; --leaf:#4E7D3A;
  --font-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1730; --paper-2:#172140; --ink:#ECE6D3; --ink-2:#AEB5CB; --ink-3:#7F89A9; --rule:#2A3660;
    --gold:#DDB85F; --gold-fill:#C9A244; --seal:#C94B3E; --seal-ink:#FFF4EC;
    --water:#34558F; --water-alt:#A98A3C; --leaf:#8FBF6C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1730; --paper-2:#172140; --ink:#ECE6D3; --ink-2:#AEB5CB; --ink-3:#7F89A9; --rule:#2A3660;
  --gold:#DDB85F; --gold-fill:#C9A244; --seal:#C94B3E; --seal-ink:#FFF4EC;
  --water:#34558F; --water-alt:#A98A3C; --leaf:#8FBF6C; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin-inline:auto;padding-inline:20px;padding-block:28px 72px;display:flex;flex-direction:column;gap:28px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
a{color:var(--gold);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

.mast{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--rule);padding-bottom:12px}
.mast-k{margin:0;font-family:var(--font-display);font-weight:700;font-size:21px;color:var(--gold);letter-spacing:.08em}
.mast-n{margin:0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:500}

h1,h2,h3{font-family:var(--font-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:clamp(28px,6.2vw,40px);letter-spacing:-.005em}
h2{font-size:24px}
h3{font-size:17px;font-family:var(--font-body);font-weight:700}
p{margin:0}
.lead{font-size:19px;color:var(--ink-2)}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-l{display:flex;flex-direction:column;gap:28px}
.note{font-size:15px;color:var(--ink-2)}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:500}

.btn{appearance:none;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font:500 16px var(--font-body);padding:12px 22px;border-radius:3px;cursor:pointer}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--ink-3)}
.btn-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* portada */
.parts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.parts li{background:var(--paper);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.parts .r{font-family:var(--font-display);font-weight:800;color:var(--gold);font-size:17px}
.parts .n{font-weight:700}
.parts .d{font-size:14px;color:var(--ink-2)}
@media (max-width:460px){.parts{grid-template-columns:1fr}}

figure{margin:0;display:flex;flex-direction:column;gap:10px}
figcaption{font-size:14px;color:var(--ink-2)}
.hex{width:100%;max-width:470px;height:auto;display:block;margin-inline:auto}
.hx-outer{fill:var(--paper-2);stroke:var(--ink-3);stroke-width:1.5}
.hx-ring{fill:none;stroke:var(--rule);stroke-width:1}
.hx-spoke{stroke:var(--rule);stroke-width:1}
.hx-v{fill:var(--paper);stroke:var(--ink-3);stroke-width:1.5}
.hx-v.is-type{fill:var(--ink);stroke:var(--ink)}
.hx-k{font-family:var(--font-display);font-weight:700;font-size:13px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.hx-k.is-type{fill:var(--paper)}
.hx-name{font-family:var(--font-body);font-weight:500;font-size:13px;fill:var(--ink)}
.hx-eff{font-family:var(--font-body);font-size:12px;fill:var(--ink-2);font-variant-numeric:tabular-nums}
.hx-lean{stroke:var(--gold-fill);stroke-width:5;stroke-linecap:round;fill:none}
.hx-aura{stroke:var(--gold-fill);stroke-width:1.5;fill:none}
.hx-dot{fill:var(--gold-fill);stroke:var(--paper-2);stroke-width:2.5}
.key{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--ink-2);justify-content:center}
.key span{display:inline-flex;align-items:center;gap:7px}
.key i{display:inline-block;width:12px;height:12px;border-radius:50%}
.key .k-type{background:var(--ink)}
.key .k-pos{background:var(--gold-fill)}
.key .k-lean{width:18px;height:5px;border-radius:3px;background:var(--gold-fill)}

/* progreso */
.prog{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--paper);padding-block:10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--rule)}
.prog-top{display:flex;justify-content:space-between;gap:12px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
.prog-top b{font-weight:700;color:var(--ink)}
.prog-n{font-variant-numeric:tabular-nums;letter-spacing:.04em}
.segs{display:flex;gap:4px}
.seg{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;min-width:0}
.seg i{display:block;height:100%;background:var(--ink);border-radius:2px}

/* preguntas */
.q{display:flex;flex-direction:column;gap:20px}
.q-hint{font-size:15px;color:var(--ink-2)}
fieldset{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:10px}
legend{padding:0}
.q-text{font-family:var(--font-display);font-weight:700;font-size:clamp(22px,4.8vw,27px);line-height:1.3;text-wrap:balance;margin-bottom:10px;outline:none}
.q-num{font-family:var(--font-body);font-size:13px;font-weight:700;color:var(--gold);letter-spacing:.08em;display:block;margin-bottom:6px;font-variant-numeric:tabular-nums}
.opt{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border:1px solid var(--rule);border-radius:3px;background:var(--paper-2);cursor:pointer;position:relative}
.opt:hover{border-color:var(--ink-3)}
.opt input,.pt input{position:absolute;opacity:0;width:1px;height:1px}
.opt-mark{flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ink-3);margin-top:5px}
.opt input:checked + .opt-mark{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--paper-2)}
.opt:has(input:checked){border-color:var(--ink)}
.opt:has(input:focus-visible),.pt:has(input:focus-visible) .pt-b{outline:2px solid var(--gold);outline-offset:2px}
.opt-t{min-width:0}
.lk-row{padding-block:18px;border-top:1px solid var(--rule)}
.lk-row:first-child{border-top:0;padding-top:0}
.lk{gap:12px}
.lk-t{font-size:18px;font-weight:500;line-height:1.45;margin-bottom:12px}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.pt{position:relative;cursor:pointer}
.pt-b{display:flex;align-items:center;justify-content:center;height:46px;border:1px solid var(--rule);border-radius:3px;background:var(--paper-2);font-weight:700;font-size:15px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pt:hover .pt-b{border-color:var(--ink-3)}
.pt input:checked + .pt-b{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.scale-ends{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3)}
.q-nav{display:flex;justify-content:space-between;gap:12px;padding-top:8px}

/* resultado */
.plate{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.seal{width:92px;height:92px;background:var(--seal);color:var(--seal-ink);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:58px;line-height:1;border-radius:5px;transform:rotate(-3deg)}
.plate-sub{font-size:15px;color:var(--ink-2);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;font-weight:500;padding:4px 10px;border:1px solid var(--rule);border-radius:999px;color:var(--ink-2);background:var(--paper-2)}
.sec{display:flex;flex-direction:column;gap:16px;border-top:1px solid var(--rule);padding-top:26px}
.two{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:520px){.two{grid-template-columns:1fr}.plate{gap:16px}.seal{width:76px;height:76px;font-size:48px}}
.glass{width:100%;max-width:200px;height:auto;display:block;margin-inline:auto}
.gl-glass{fill:none;stroke:var(--ink-2);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.gl-table{stroke:var(--rule);stroke-width:1.5}
.gl-water{fill:var(--water)}
.gl-leaf{fill:var(--leaf)}
.gl-rib{stroke:var(--paper-2);stroke-width:1;fill:none}
.gl-speck{fill:var(--ink-2);opacity:0}
.gl-drop{fill:var(--water);opacity:0}
.gl-spark{fill:var(--gold-fill);opacity:0}
.gl-leafwrap,.gl-leafmove,.gl-leafspin,.gl-speck,.gl-spark,.gl-drop{transform-box:fill-box;transform-origin:center}
@keyframes gl-rise{to{transform:translateY(-44px)}}
@keyframes gl-drip{0%{opacity:0;transform:translateY(0)}12%{opacity:1}100%{opacity:0;transform:translateY(130px)}}
@keyframes gl-tint{to{fill:var(--water-alt)}}
@keyframes gl-speck{from{opacity:0;transform:translateY(-12px)}to{opacity:.9;transform:none}}
@keyframes gl-slide{from{transform:translateX(-26px) rotate(-8deg)}to{transform:translateX(26px) rotate(8deg)}}
@keyframes gl-spin{to{transform:rotate(360deg)}}
@keyframes gl-twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
.fx-pot .gl-water,.fx-pot .gl-leafwrap{animation:gl-rise 2.2s .4s cubic-bezier(.3,.7,.2,1) forwards}
.fx-pot .gl-drop{animation:gl-drip 1.9s 2.5s ease-in infinite}
.fx-pot .gl-drop.d2{animation-delay:3.3s}
.fx-emi .gl-water,.fx-esp .gl-water{animation:gl-tint 2.4s .4s ease forwards}
.fx-mat .gl-speck{animation:gl-speck 1.4s ease forwards;animation-delay:calc(var(--i) * .22s + .4s)}
.fx-man .gl-leafmove{animation:gl-slide 2.6s ease-in-out infinite alternate}
.fx-esp .gl-leafspin{animation:gl-spin 5s linear infinite}
.fx-tra .gl-spark{animation:gl-twinkle 2.2s ease-in-out infinite;animation-delay:calc(var(--i) * .5s)}
@media (prefers-reduced-motion: reduce){
  .glass *{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important;animation-direction:normal!important;animation-fill-mode:forwards!important}
  .fx-pot .gl-drop{animation:none!important;opacity:1;transform:translateY(46px)}
  .fx-tra .gl-spark{animation:none!important;opacity:1}
  .fx-esp .gl-leafspin{animation:none!important;transform:rotate(35deg)}
}

.read{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 18px;margin:0}
.read dt{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:500;padding-top:4px}
.read dd{margin:0}
.read dd b{font-family:var(--font-display);font-size:21px;font-weight:700}

.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:minmax(0,11.5em) minmax(0,1fr) auto;gap:6px 14px;align-items:center}
.bar-name{font-weight:500;display:flex;gap:8px;align-items:baseline;min-width:0}
.bars.wide .bar{grid-template-columns:minmax(0,15.5em) minmax(0,1fr) auto}
.bar-name .note{white-space:nowrap}
.bar-name .k{font-family:var(--font-display);font-weight:700;color:var(--ink-3)}
.bar.is-top .bar-name .k{color:var(--gold)}
.bar-track{height:10px;border-left:1px solid var(--ink-3);display:block}
.bar-fill{display:block;height:100%;background:var(--ink-3);border-radius:0 4px 4px 0;min-width:2px}
.bar.is-top .bar-fill{background:var(--gold-fill)}
.bar-val{font-size:15px;color:var(--ink-2);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.bar.is-top .bar-name,.bar.is-top .bar-val{font-weight:700;color:var(--ink)}
@media (max-width:520px){
  .bar,.bars.wide .bar{grid-template-columns:minmax(0,1fr) auto}
  .bar-name{grid-column:1;grid-row:1}.bar-val{grid-column:2;grid-row:1}.bar-track{grid-column:1 / -1;grid-row:2}
}
.gate{font-size:15px;color:var(--ink-2);border:1px dashed var(--rule);border-radius:3px;padding:12px 14px}
.who{font-size:15px;color:var(--ink-2)}
details{border-top:1px solid var(--rule);padding-top:18px}
summary{cursor:pointer;font-weight:700}
details ol{margin:14px 0 0;padding-left:1.3em;display:flex;flex-direction:column;gap:10px;font-size:15px;color:var(--ink-2)}
.copybox{width:100%;min-height:120px;font:400 14px/1.5 var(--font-body);color:var(--ink);background:var(--paper-2);border:1px solid var(--rule);border-radius:3px;padding:10px}
.toast{font-size:14px;color:var(--ink-2)}
</style>

<div class="wrap">
  <header class="mast">
    <p class="mast-k" lang="ja" aria-hidden="true">水見式</p>
    <p class="mast-n">Test de Nen</p>
  </header>
  <main id="app"></main>

</div>

<script>
(function(){
"use strict";
/*CORE-START*/
var ORDER=["pot","tra","mat","esp","man","emi"];
var REG=["pot","tra","mat","man","emi"];
var PRIN=["ten","zetsu","ren","hatsu"];

var B1=[
 {id:"i1",q:"Te cambian las reglas de un proyecto a última hora. ¿Qué haces primero?",o:[
  ["pot","Pregunto qué hay que hacer ahora y me pongo a hacerlo."],
  ["emi","Protesto en el momento y en voz alta. Al rato ya estoy en otra cosa."],
  ["tra","Me hace gracia. Busco la ventaja que el cambio me da y que nadie ha visto."],
  ["mat","Leo las reglas nuevas enteras y busco dónde pueden fallar antes de moverme."],
  ["man","Pido la razón del cambio. Si no me convence, sigo con mi plan."]]},
 {id:"i2",q:"Descubres que alguien te ha mentido a la cara.",o:[
  ["pot","Se lo digo de frente, con enfado y sin rodeos."],
  ["emi","Estallo ahí mismo. Después se me pasa y probablemente lo perdone."],
  ["tra","No digo nada. Le sigo el juego y me guardo la carta."],
  ["mat","Reviso qué más pudo falsear. Desde entonces compruebo todo lo que me dice."],
  ["man","Le expongo la contradicción punto por punto hasta que no pueda sostenerla."],
  ["esp","Me aparto sin escena. No vuelve a saber nada importante de mí."]]},
 {id:"i3",q:"¿Qué objeto te representa mejor?",o:[
  ["pot","Ninguno. Me basto con mis manos."],
  ["man","Una herramienta que uso desde hace años y que nadie más toca."],
  ["mat","Algo hecho por mí, exacto, con cada detalle pensado."],
  ["tra","Algo que parece una cosa y resulta ser otra."],
  ["emi","Algo que llega lejos: una pelota, un altavoz, una carta."]]},
 {id:"i4",q:"¿Cómo aprendes mejor algo nuevo?",o:[

  ["tra","Jugando con variantes. Si siempre es igual, lo dejo."],

  ["man","Diseño mi método y mi calendario, y nadie me los mueve."]]},
 {id:"i5",q:"Un amigo te llama porque está en un lío serio.",o:[
  ["pot","Voy. Las preguntas, después."],
  ["emi","Me indigno por él y muevo a quien haga falta, a gritos si es necesario."],
  ["tra","Lo ayudo a mi manera, y puede que nunca sepa cuánto hice."],
  ["mat","Primero averiguo con calma qué pasó de verdad."],
  ["man","Tomo el mando y reparto quién hace qué. A los míos no se les toca."]]},
 {id:"i6",q:"En una discusión de grupo, sueles ser quien…",o:[
  ["pot","dice lo que piensa sin filtro."],
  ["emi","sube el tono primero y también hace las paces primero."],
  ["tra","suelta la frase que descoloca a todos, medio en broma."],
  ["mat","calla, observa y al final señala el fallo que nadie vio."],
  ["man","argumenta hasta el final. Rara vez me convencen."],
  ["esp","habla poco y aun así acaba marcando el rumbo."]]},
 {id:"i7",q:"¿Qué te cuesta más?",o:[
  ["pot","Disimular lo que siento."],
  ["emi","Esperar, y cuidar los detalles finos."],
  ["tra","Mantener el interés en lo mismo mucho tiempo."],
  ["mat","Relajarme y bajar la guardia."],
  ["man","Ceder, o ir al ritmo de otra persona."]]},
 {id:"i8",q:"Si tu energía pudiera hacer una sola cosa, ¿cuál elegirías por instinto?",o:[

 {id:"i10",q:"¿Cómo te describe la gente que te conoce poco?",o:[

 {id:"i11",q:"Un plan fracasa por un error tuyo.",o:[

 {id:"i12",q:"¿Cuál es tu relación con la mentira?",o:[

  ["emi","La verdad se me escapa antes de pensarlo."]]}
];

var B2=[
 {id:"c1",k:"pot",t:"Cuando quiero algo voy en línea recta, aunque moleste a alguien."},
 {id:"c2",k:"mat",t:"Voy en guardia: suelo anticipar lo que puede salir mal."},
 {id:"c3",k:"tra",t:"Me aburro de cosas que hace poco me apasionaban."},
 {id:"c4",k:"man",t:"Si creo tener razón, discuto hasta el final."},
 {id:"c5",k:"emi",t:"Me enfado rápido y se me pasa igual de rápido."},

function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function hexDist(a,b){var d=Math.abs(ORDER.indexOf(a)-ORDER.indexOf(b));return Math.min(d,6-d);}
function eff(t,c){return [1,0.8,0.6,0.4][hexDist(t,c)];}
function zero(keys){var o={};keys.forEach(function(k){o[k]=0;});return o;}

function scoreNen(a){
  a=a||{};
  var answered=0,total=B1.length+B2.length+B3.length+B4.length;
  var picks=zero(REG),lik=zero(REG),specPicks=0,specLik=0;
  B1.forEach(function(it){var v=a[it.id];if(v==null)return;answered++;if(v==="esp")specPicks++;else if(picks[v]!=null)picks[v]++;});
  B2.forEach(function(it){var v=a[it.id];if(v==null)return;answered++;var d=v-2;if(it.k==="esp")specLik+=d;else lik[it.k]+=d;});
  var innate={};REG.forEach(function(c){innate[c]=3*picks[c]+1.5*lik[c];});
  var ix=function(c){return REG.indexOf(c);};
  var rank=REG.slice().sort(function(x,y){return (innate[y]-innate[x])||(picks[y]-picks[x])||(lik[y]-lik[x])||(ix(x)-ix(y));});
  var base=rank[0],second=rank[1],margin=innate[base]-innate[second];
  var clarity=margin>=12?"alta":margin>=6?"media":"baja";
  var iTop=REG.slice().sort(function(x,y){return (picks[y]-picks[x])||(lik[y]-lik[x])||(ix(x)-ix(y));})[0];
  var cTop=REG.slice().sort(function(x,y){return (lik[y]-lik[x])||(picks[y]-picks[x])||(ix(x)-ix(y));})[0];
  var coherence=iTop===cTop?"coinciden":(hexDist(iTop,cTop)===1?"vecinas":"discrepan");
  var isSpec=specLik>=5&&specPicks>=2;
  var specNorm=0.5*(specLik+8)/16+0.5*specPicks/4;
  var type=isSpec?"esp":base;

  var pos=0;REG.forEach(function(c){pos+=Math.max(0,innate[c]);});
  var innShare={};REG.forEach(function(c){innShare[c]=pos>0?Math.max(0,innate[c])/pos:0.2;});
  var p3=zero(REG),n3=0;
  B3.forEach(function(it){var v=a[it.id];if(v==null)return;answered++;n3++;if(p3[v]!=null)p3[v]++;});
  var P={};REG.forEach(function(c){P[c]=n3?p3[c]/n3:0.2;});
  var C={};REG.forEach(function(c){C[c]=0.4*innShare[c]+0.6*P[c];});

  var i=ORDER.indexOf(type),cw=ORDER[(i+1)%6],ccw=ORDER[(i+5)%6],own,vcw,vccw;
  if(type==="esp"){own=Math.max(C.man,C.mat);vcw=C.man;vccw=C.mat;own=own*0.5;}
  else{
    own=C[type];
    var specLean=clamp((specNorm-0.25)/0.75,0,1)*own;
    vcw=cw==="esp"?specLean:C[cw];vccw=ccw==="esp"?specLean:C[ccw];
  }
  var leanRaw=clamp(1.5*(vcw-vccw)/Math.max(own+vcw+vccw,0.05),-1,1);
  var angle=((i*60+30*leanRaw)%360+360)%360;
  var leanDeg=Math.abs(30*leanRaw),leanTo=leanRaw>=0?cw:ccw;

  var acc={ten:[],zetsu:[],ren:[],hatsu:[]};
  B4.forEach(function(it){var v=a[it.id];if(v==null)return;answered++;acc[it.k].push(it.r?4-v:v);});
  var prin={},dom=0;
  PRIN.forEach(function(k){var arr=acc[k],s=0;arr.forEach(function(v){s+=v;});prin[k]=arr.length?s/arr.length/4:0.5;dom+=prin[k]/4;});
  var weakest=PRIN.slice().sort(function(x,y){return (prin[x]-prin[y])||(PRIN.indexOf(x)-PRIN.indexOf(y));})[0];

  var effNow=0;REG.forEach(function(c){effNow+=P[c]*eff(type,c);});
  var topP=REG.slice().sort(function(x,y){return (P[y]-P[x])||(eff(type,y)-eff(type,x))||(ix(x)-ix(y));})[0];
  var mismatch=n3>0&&P[topP]>=0.375&&eff(type,topP)<=0.6;

  return {answered:answered,total:total,done:answered>=total,type:type,base:base,second:second,rank:rank,
    innate:innate,picks:picks,lik:lik,innShare:innShare,margin:margin,clarity:clarity,coherence:coherence,iTop:iTop,cTop:cTop,
    isSpec:isSpec,specPicks:specPicks,specLik:specLik,specNorm:specNorm,P:P,n3:n3,
    angle:angle,leanRaw:leanRaw,leanDeg:leanDeg,leanTo:leanTo,dominio:dom,prin:prin,weakest:weakest,
    effNow:effNow,topP:topP,mismatch:mismatch};
}

  s+='<ellipse class="gl-drop" cx="56" cy="40" rx="3" ry="4.5"/><ellipse class="gl-drop d2" cx="184" cy="40" rx="3" ry="4.5"/>';
  s+='<path class="gl-glass" d="M58,28 L72,206 Q72.3,210 76,210 L164,210 Q167.7,210 168,206 L182,28"/>';
  s+='<g class="gl-leafwrap"><g class="gl-leafmove"><g class="gl-leafspin"><path class="gl-leaf" d="M97,78 Q120,63 143,78 Q120,93 97,78 Z"/><path class="gl-rib" d="M100,78 L140,78"/></g></g></g>';
  [[96,54],[126,46],[150,58]].forEach(function(p,i){
    s+='<path class="gl-spark" style="--i:'+i+'" d="M'+p[0]+','+(p[1]-6)+' L'+(p[0]+1.6)+','+(p[1]-1.6)+' L'+(p[0]+6)+','+p[1]+' L'+(p[0]+1.6)+','+(p[1]+1.6)+' L'+p[0]+','+(p[1]+6)+' L'+(p[0]-1.6)+','+(p[1]+1.6)+' L'+(p[0]-6)+','+p[1]+' L'+(p[0]-1.6)+','+(p[1]-1.6)+' Z"/>';});
  return s+'</svg>';
}

/* ---------- vistas ---------- */
function progressHTML(stepIdx){
  var st=STEPS[stepIdx],bm=BLOCKS[st.b],done=countAnswered();
  var segs=BLOCK_ITEMS.map(function(b){var n=0;b.forEach(function(it){if(state.a[it.id]!=null)n++;});return '<span class="seg" style="flex:'+b.length+'"><i style="width:'+(100*n/b.length)+'%"></i></span>';}).join("");
  return '<div class="prog"><div class="prog-top"><span>Parte '+bm.r+' de IV · <b>'+bm.n+'</b></span><span class="prog-n">'+done+' / '+TOTAL+'</span></div><div class="segs" role="progressbar" aria-valuemin="0" aria-valuemax="'+TOTAL+'" aria-valuenow="'+done+'" aria-label="Preguntas respondidas">'+segs+'</div></div>';
}

function renderIntro(){
  var done=countAnswered(),open=firstOpenStep();
  var parts=BLOCKS.map(function(b){return '<li><span class="r">'+b.r+'</span><span class="n">'+b.n+'</span><span class="d">'+b.d+'</span></li>';}).join("");
  var cta;
  if(done>0&&open<STEPS.length){
    cta='<button class="btn" data-act="resume">Continuar en la pregunta '+QNUM[STEPS[open].items.filter(function(it){return state.a[it.id]==null;})[0].id]+'</button><button class="btn ghost" data-act="restart">Empezar de cero</button>';
  }else if(done>=TOTAL){
    cta='<button class="btn" data-act="results">Ver mi resultado</button><button class="btn ghost" data-act="restart">Empezar de cero</button>';
  }else cta='<button class="btn" data-act="start">Empezar</button>';
  app.innerHTML=
  '<div class="stack-l">'+
   '<div class="stack"><h1 tabindex="-1">¿Cuál es tu tipo de Nen y dónde estás hoy en el hexagrama?</h1>'+
   '<p class="lead">El test mide dos cosas por separado. Tu tipo es innato y no cambia. Tu posición sí: se mueve con lo que entrenas, con tu entorno y con tu mentalidad.</p></div>'+
   '<figure>'+hexSVG({type:"tra",angle:30,frac:1,showEff:false,label:"Hexagrama del Nen con las seis categorías. Ejemplo: Killua, a medio camino entre Transmutación e Intensificación."})+
   '<div class="key"><span><i class="k-type"></i>tipo innato</span><span><i class="k-lean"></i>inclinación</span><span><i class="k-pos"></i>posición</span></div>'+
   '<figcaption>Ejemplo del manga: Killua es transmutador y está a medio camino de Intensificación. En tu resultado, la distancia al centro añade cuánto dominas los cuatro principios.</figcaption></figure>'+
   '<div class="stack"><p class="eyebrow">51 preguntas · unos 9 minutos</p><ol class="parts">'+parts+'</ol>'+
   '<p class="note">Las partes I y II buscan tu tipo con dos métodos distintos y comparan si coinciden. Las partes III y IV miden tu estado de ahora.</p></div>'+
   '<div class="btn-row">'+cta+'</div>'+
   '<p class="note">Dentro del manga, Hisoka admite que adivinar el tipo por la personalidad es tan fiable como el horóscopo o el grupo sanguíneo. Esto es un juego bien armado, no un diagnóstico. El trasfondo cultural está en el <a href="'+DOC_URL+'" target="_blank" rel="noopener">informe de investigación</a>.</p>'+
  '</div>';
}

function renderStep(focus){
  var st=STEPS[state.step],bm=BLOCKS[st.b],h=progressHTML(state.step)+'<section class="q"><p class="q-hint">'+bm.hint+'</p>';
  if(st.t==="fc"){
    var it=st.items[0],opts=shuffled(it.o,state.seed+QNUM[it.id]*7919);
    h+='<fieldset><legend class="q-text" tabindex="-1"><span class="q-num">Pregunta '+QNUM[it.id]+'</span>'+it.q+'</legend>';
    opts.forEach(function(o){
      h+='<label class="opt"><input type="radio" name="'+it.id+'" id="'+it.id+'-'+o[0]+'" value="'+o[0]+'"'+(state.a[it.id]===o[0]?" checked":"")+'><span class="opt-mark"></span><span class="opt-t">'+o[1]+'</span></label>';});
    h+='</fieldset>';
  }else{
    h+='<div>';
    st.items.forEach(function(it,ix){
      h+='<div class="lk-row"><fieldset class="lk"><legend class="lk-t"'+(ix===0?' tabindex="-1"':'')+'><span class="q-num">Frase '+QNUM[it.id]+'</span>'+it.t+'</legend><div class="scale">';
      bm.scale.forEach(function(lab,v){
        h+='<label class="pt"><input type="radio" name="'+it.id+'" id="'+it.id+'-'+v+'" value="'+v+'"'+(state.a[it.id]===v?" checked":"")+'><span class="pt-b" title="'+lab+'">'+(v+1)+'<span class="vh"> '+lab+'</span></span></label>';});
      h+='</div><div class="scale-ends" aria-hidden="true"><span>1 · '+bm.scale[0]+'</span><span>5 · '+bm.scale[4]+'</span></div></fieldset></div>';
    });
    h+='</div>';
  }
  var last=state.step===STEPS.length-1;
  h+='<nav class="q-nav"><button class="btn ghost" data-act="prev">'+(state.step===0?"Portada":"Anterior")+'</button><button class="btn" data-act="next"'+(stepDone()?"":" disabled")+'>'+(last?"Ver mi resultado":"Siguiente")+'</button></nav></section>';
  app.innerHTML=h;
  if(focus){var el=app.querySelector("legend[tabindex]");if(el){try{el.focus({preventScroll:true});}catch(e){}}window.scrollTo(0,0);}
}
function stepDone(){return STEPS[state.step].items.every(function(it){return state.a[it.id]!=null;});}

function barsHTML(rows,wide){
  return '<div class="bars'+(wide?" wide":"")+'">'+rows.map(function(r){
    return '<div class="bar'+(r.top?" is-top":"")+'" title="'+r.title+'"><span class="bar-name"><span class="k" lang="ja" aria-hidden="true">'+r.k+'</span>'+r.name+'</span><span class="bar-track"><span class="bar-fill" style="width:'+Math.max(0,Math.min(100,r.w*100)).toFixed(1)+'%"></span></span><span class="bar-val">'+r.val+'</span></div>';
  }).join("")+'</div>';
}

function leanText(r){
  var T=CAT[r.type].n,N=CAT[r.leanTo].n,d=Math.round(r.leanDeg);
  if(r.leanDeg<5)return {short:"sin inclinación apreciable",long:"Estás en el vértice de "+T+", sin inclinación apreciable hacia ninguna vecina."};
  var kind=r.leanDeg<14?"una inclinación ligera":r.leanDeg<22?"una inclinación marcada":"doble afinidad";
  var extra=r.leanDeg>=22?" Es el caso de Killua entre Transmutación e Intensificación: aprendes la vecina casi tan rápido como la propia, aunque su eficiencia siga en el 80 %.":" La inclinación acelera el aprendizaje de esa vecina; su eficiencia sigue en el 80 %.";
  if(r.leanTo==="esp")extra=" En el manga, materializadores y manipuladores son quienes más opciones tienen de volverse especialistas con el tiempo.";
  return {short:d+"° hacia "+N,long:"Estás en "+T+", "+d+"° hacia "+N+": "+kind+". El máximo son 30°, el punto medio de la arista."+extra};
}
function domWord(x){return x<0.35?"nodos recién abiertos":x<0.55?"base en construcción":x<0.75?"base sólida":"control fino";}

function summaryText(r){
  var c=CAT[r.type],lt=leanText(r);
  return "Test de Nen\nTipo: "+c.n+" ("+c.k+")"+(r.isSpec?" · base "+CAT[r.base].n:"")+
   "\nClaridad: "+r.clarity+" · instinto y carácter "+(r.coherence==="coinciden"?"coinciden":r.coherence==="vecinas"?"apuntan a categorías vecinas":"discrepan")+
   "\nPosición: "+lt.short+
   "\nDominio de los cuatro principios: "+Math.round(r.dominio*100)+" % ("+PRIN.map(function(k){return PR[k].n+" "+Math.round(r.prin[k]*100);}).join(", ")+")"+
   "\nRendimiento de la práctica actual: "+Math.round(r.effNow*100)+" %"+
   "\nAdivinación del agua: "+c.agua;
}

function renderResults(){
  var r=scoreNen(state.a),c=CAT[r.type],lt=leanText(r);
  var cohTxt=r.coherence==="coinciden"?"Instinto y carácter coinciden":r.coherence==="vecinas"?"Instinto y carácter apuntan a vecinas":"Instinto y carácter discrepan";
  var sub=c.k+" · "+c.en;
  var clar;
  if(r.clarity==="alta")clar="Resultado claro: "+CAT[r.base].n+" saca "+fmt(r.margin)+" puntos a "+CAT[r.second].n+", la segunda.";
  else if(r.clarity==="media")clar="Resultado probable: "+CAT[r.base].n+" saca "+fmt(r.margin)+" puntos a "+CAT[r.second].n+".";
  else clar="Resultado ajustado: "+CAT[r.base].n+" y "+CAT[r.second].n+" casi empatan ("+fmt(r.margin)+" puntos). "+(hexDist(r.base,r.second)===1?"Son vecinas en el hexagrama, así que la lectura es coherente: estás en esa arista.":"No son vecinas en el hexagrama. Conviene repetir el test otro día.");
  if(r.isSpec)clar="Has cruzado la puerta de Especialización. Tu categoría de base es "+CAT[r.base].n+(r.base==="mat"||r.base==="man"?", una de las dos desde las que el manga dice que es más fácil llegar.":". En el manga lo habitual es llegar desde Materialización o Manipulación, así que tu caso sería atípico.");

  var aff=REG.map(function(k){return {k:CAT[k].s,name:CAT[k].n,w:r.innShare[k],val:pct(r.innShare[k]),top:k===r.base,title:CAT[k].n+": "+fmt(r.innate[k])+" puntos ("+r.picks[k]+" elecciones en la parte I, "+(r.lik[k]>0?"+":"")+r.lik[k]+" en las frases de la parte II)"};});
  var prb=PRIN.map(function(k){return {k:PR[k].k,name:PR[k].n+" <span class=\"note\">· "+PR[k].d+"</span>",w:r.prin[k],val:pct(r.prin[k]),top:false,title:PR[k].n+": "+Math.round(r.prin[k]*100)+" %"};});
  var prac=REG.map(function(k){return {k:CAT[k].s,name:CAT[k].n,w:r.P[k],val:pct(r.P[k])+" · rinde al "+pct(eff(r.type,k)),top:k===r.type,title:CAT[k].n+": "+Math.round(r.P[k]*8)+" de 8 respuestas; eficiencia "+Math.round(eff(r.type,k)*100)+" %"};});
  var pracMsg="Lo que más trabajas es "+CAT[r.topP].n+", donde tu tipo rinde al "+pct(eff(r.type,r.topP))+".";
  if(r.mismatch)pracMsg+=" Estás poniendo el grueso del esfuerzo lejos de tu categoría. En la obra, Hisoka llama a eso sobrecarga de memoria: fue el error de Kastro.";
  else if(r.topP===r.type)pracMsg+=" Entrenas sobre todo lo tuyo, que es lo que más rinde.";
  pracMsg+=" Biscuit recomienda entrenar todas las categorías accesibles, con menos tiempo cuanto más lejos queden de la propia.";
  var gate="Indicador de Especialización: "+r.specPicks+" de 4 respuestas en la parte I y "+(r.specLik>0?"+":"")+r.specLik+" puntos de 8 en la parte II. La puerta se abre con 2 respuestas y +5 puntos a la vez. Es estrecha a propósito: en el manga, Morena estima un especialista por cada 3.000 usuarios.";
  var espNote=r.type==="esp"?'<p class="note">El manga dice que el especialista aprende todas las categorías con facilidad, pero no confirma su eficiencia en ellas. Las cifras del diagrama salen de la geometría del hexagrama.</p>':"";

  app.innerHTML=
  '<div class="stack-l">'+
   '<div class="stack">'+
    '<div class="plate"><div class="seal" lang="ja" aria-hidden="true">'+c.s+'</div><div><p class="eyebrow">Tu tipo de Nen</p><h1 tabindex="-1">'+c.n+'</h1><p class="plate-sub">'+sub+(r.leanDeg>=5&&r.type!=="esp"?" · "+lt.short:"")+'</p></div></div>'+
    '<div class="chips"><span class="chip">Claridad '+r.clarity+'</span><span class="chip">'+cohTxt+'</span><span class="chip">Dominio '+pct(r.dominio)+'</span></div>'+
    '<p class="lead">'+c.nat+'</p><p class="note">'+clar+'</p>'+
   '</div>'+

   '<section class="sec"><h2>Adivinación del agua</h2><div class="two">'+glassSVG(r.type)+'<div class="stack"><p>'+c.agua+'</p><p class="note">Es la única prueba segura dentro de la obra: una hoja sobre un vaso lleno y Ren con las manos alrededor. Este dibujo muestra lo que le correspondería a tu tipo.</p></div></div></section>'+

   '<section class="sec"><h2>Tu posición en el hexagrama</h2>'+
    '<figure>'+hexSVG({type:r.type,angle:r.angle,frac:r.dominio,showEff:true,label:"Hexagrama del Nen. Tipo "+c.n+", posición "+lt.short+", dominio "+Math.round(r.dominio*100)+" por ciento."})+
    '<div class="key"><span><i class="k-type"></i>tipo innato</span><span><i class="k-lean"></i>inclinación</span><span><i class="k-pos"></i>tu posición</span></div>'+
    '<figcaption>Los porcentajes son la eficiencia de tu tipo en cada categoría según el manga. La Especialización es todo o nada: quien no nace con ella no puede usarla. Los anillos marcan el 25, 50 y 75 % de dominio.</figcaption></figure>'+
    '<dl class="read"><dt>Ángulo</dt><dd><b>'+(r.leanDeg<5?"En el vértice":lt.short.charAt(0).toUpperCase()+lt.short.slice(1))+'</b><br>'+lt.long+'</dd>'+
    '<dt>Distancia</dt><dd><b>'+pct(r.dominio)+' del radio</b><br>Es tu dominio de los cuatro principios: '+domWord(r.dominio)+'. En el centro el aura se escapa sin control; en el borde se sostiene sola.</dd></dl>'+espNote+
   '</section>'+

   '<section class="sec"><h2>Afinidad innata</h2><p class="note">Reparto de los puntos de las partes I y II entre las cinco categorías que se pueden entrenar.</p>'+barsHTML(aff)+'<p class="gate">'+gate+'</p></section>'+

   '<section class="sec"><h2>Los cuatro principios</h2><p class="note">Tu estado de las últimas cuatro semanas. El más bajo es el que frena a los demás.</p>'+barsHTML(prb,true)+
    '<div class="stack"><h3>Empieza por '+PR[r.weakest].n+' <span lang="ja">('+PR[r.weakest].k+')</span></h3><p>'+PR[r.weakest].fix+'</p></div></section>'+

   '<section class="sec"><h2>Práctica actual</h2><dl class="read"><dt>Rendimiento</dt><dd><b>'+pct(r.effNow)+'</b><br>Es lo que rinde tu esfuerzo de los últimos tres meses, pesando cada categoría por la eficiencia de tu tipo.</dd></dl>'+barsHTML(prac)+'<p>'+pracMsg+'</p></section>'+

   '<section class="sec"><h2>Tu Hatsu</h2><p>'+c.hatsu+'</p><dl class="read"><dt>Condición</dt><dd>'+c.voto+'</dd><dt>Punto débil</dt><dd>'+c.sombra+'</dd><dt>En la obra</dt><dd>'+c.who+'.</dd></dl>'+
    '<p class="note">El manga insiste en que una buena habilidad sale del carácter y se siente correcta para quien la crea. Copiar la de otro no lleva a dominarla.</p></section>'+

   '<details><summary>Cómo se calculó</summary><ol>'+
    '<li><b>Tipo.</b> Cada elección de la parte I vale 3 puntos para su categoría. Cada frase de la parte II suma entre −3 y +3. Gana la categoría con más puntos; la claridad es la ventaja sobre la segunda (alta desde 12 puntos, media desde 6).</li>'+
    '<li><b>Especialización.</b> No compite por puntos. Solo sale si eliges al menos 2 de las 4 respuestas de especialista en la parte I y además sumas +5 o más en sus 4 frases de la parte II.</li>'+
    '<li><b>Ángulo.</b> Compara tus dos categorías vecinas mezclando un 40 % de afinidad innata y un 60 % de práctica reciente. El resultado desplaza el punto hasta 30° desde tu vértice.</li>'+
    '<li><b>Distancia al centro.</b> Media de los cuatro principios, tres frases cada uno, con tres de ellas puntuadas al revés.</li>'+
    '<li><b>Rendimiento.</b> Reparto de tu práctica multiplicado por la eficiencia del manga: 100 % en tu categoría, 80 % en las vecinas, 60 % en las siguientes y 40 % en la opuesta.</li>'+
    '<li><b>Qué es del manga y qué no.</b> Las categorías, el hexagrama, las eficiencias, los rasgos de Hisoka y la idea de que la inclinación cambia vienen de la obra. Las preguntas, la traducción de cada categoría a actividades reales y el uso de la distancia al centro como medida de dominio son decisiones de este test.</li>'+
   '</ol></details>'+

   '<div class="stack"><div class="btn-row"><button class="btn" data-act="copy">Copiar resultado</button><button class="btn ghost" data-act="review">Revisar respuestas</button><button class="btn ghost" data-act="restart">Repetir el test</button></div><div id="aux"></div>'+
   '<p class="note">Tu posición cambia: vuelve a responder las partes III y IV dentro de unos meses y compara. El trasfondo de cada idea está en el <a href="'+DOC_URL+'" target="_blank" rel="noopener">informe de investigación</a>.</p></div>'+
  '</div>';
}
function fmt(x){return (Math.round(x*10)/10).toString().replace(".",",");}

function render(focus){
  if(state.view==="intro")renderIntro();
  else if(state.view==="res")renderResults();
  else renderStep(focus);
  if(focus&&state.view!=="q"){var h=app.querySelector("h1");if(h){try{h.focus({preventScroll:true});}catch(e){}}window.scrollTo(0,0);}
}
function go(view,step){state.view=view;if(step!=null)state.step=step;save();render(true);}

var advTimer=null;
app.addEventListener("change",function(ev){
  var t=ev.target;if(!t||t.type!=="radio")return;
  var st=STEPS[state.step];
  state.a[t.name]=st.t==="lk"?parseInt(t.value,10):t.value;save();
  var nb=app.querySelector('[data-act="next"]');if(nb)nb.disabled=!stepDone();
  var pn=app.querySelector(".prog-n");if(pn)pn.textContent=countAnswered()+" / "+TOTAL;
  if(st.t==="fc"){clearTimeout(advTimer);advTimer=setTimeout(function(){if(state.view==="q"&&stepDone())next();},280);}
});
function next(){if(!stepDone())return;if(state.step>=STEPS.length-1){if(countAnswered()>=TOTAL)go("res");else go("q",firstOpenStep());}else go("q",state.step+1);}
app.addEventListener("click",function(ev){
  var b=ev.target.closest?ev.target.closest("[data-act]"):null;if(!b)return;
  var act=b.getAttribute("data-act"),aux=document.getElementById("aux");
  clearTimeout(advTimer);
  if(act==="start")go("q",0);
  else if(act==="resume")go("q",Math.min(firstOpenStep(),STEPS.length-1));
  else if(act==="results")go("res");
  else if(act==="review")go("q",0);
  else if(act==="prev"){if(state.step===0)go("intro");else go("q",state.step-1);}
  else if(act==="next")next();
  else if(act==="restart"){
    if(b.getAttribute("data-armed")==="1"){state.a={};state.step=0;state.seed=Math.floor(Math.random()*1e9);go("intro");}
    else{b.setAttribute("data-armed","1");b.textContent="Confirmar: borrar mis respuestas";}
  }
  else if(act==="copy"){
    var txt=summaryText(scoreNen(state.a));
    var fallback=function(){if(!aux)return;aux.innerHTML='<label class="vh" for="copybox">Resultado en texto</label><textarea class="copybox" id="copybox" readonly></textarea><p class="toast">No se pudo copiar de forma automática. El texto está seleccionado: cópialo desde aquí.</p>';var ta=document.getElementById("copybox");ta.value=txt;ta.focus();ta.select();};
    try{navigator.clipboard.writeText(txt).then(function(){if(aux)aux.innerHTML='<p class="toast" role="status">Resultado copiado.</p>';},fallback);}catch(e){fallback();}
  }
});

function start(data){
  load();
  if(data&&data.a){state.a=data.a;state.step=data.step||0;state.seed=data.seed||state.seed;state.view=data.view||"intro";}
  else state.view=countAnswered()>=TOTAL?"res":"intro";
  if(state.step>=STEPS.length)state.step=STEPS.length-1;
  render(false);
}
var hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot){try{hot.snapshot(function(){return {a:state.a,step:state.step,seed:state.seed,view:state.view};});}catch(e){}}
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
})();
</script>

</body></html>
